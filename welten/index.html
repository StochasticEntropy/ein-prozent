<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Die Rätselwelten</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1b1440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/char.css">
<style>
  :root { --ink: #fdf8ff; --gold: #ffc940; --ok: #2fe39f; --bad: #ff4d6d; --panel: rgba(28, 18, 64, .78); --line: rgba(255, 255, 255, .18);
    --display: 'Bricolage Grotesque', system-ui, sans-serif; --font: 'Inter', system-ui, -apple-system, sans-serif; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1440; color: var(--ink); font-family: var(--font); touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  .gone { opacity: 0; pointer-events: none; transform: scale(1.04); transition: opacity .6s, transform .6s; }

  /* Laden */
  #loading { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #3b2a8a, #160f36); transition: opacity .6s; }
  .load-box { width: min(320px, 80vw); text-align: center; font-family: var(--display); font-size: 1.3rem; }
  .load-track { height: 10px; border-radius: 6px; background: rgba(255, 255, 255, .12); overflow: hidden; margin-top: 14px; }
  #load-bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), #ff7ab6); transition: width .2s; }

  /* Titel */
  #title { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 16px calc(env(safe-area-inset-bottom) + 6vh);
    background: linear-gradient(180deg, rgba(20, 12, 50, .1) 30%, rgba(20, 12, 50, .75)); text-align: center; transition: opacity .7s, transform .7s; }
  .logo { font-family: var(--display); font-weight: 800; font-size: clamp(2.8rem, 9vw, 5.6rem); line-height: .95; letter-spacing: -.03em; margin: 0;
    background: linear-gradient(180deg, #fff 20%, #ffe39a 60%, #ffb02e); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 0 rgba(60, 20, 90, .55)) drop-shadow(0 0 30px rgba(255, 201, 64, .35)); animation: logoIn 1.1s cubic-bezier(.2, 1.6, .4, 1) both; }
  .chapter { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #ffd6f0; margin: 10px 0 22px; animation: rise .8s .3s both; }
  @keyframes logoIn { from { transform: scale(.4) rotate(-6deg); opacity: 0; } }
  @keyframes rise { from { transform: translateY(20px); opacity: 0; } }
  .menu { display: grid; gap: 10px; width: min(380px, 100%); animation: rise .8s .5s both; }
  .btn-go { border: none; border-radius: 18px; padding: 16px 20px; font-family: var(--display); font-weight: 800; font-size: 1.25rem; color: #2a1600;
    background: linear-gradient(180deg, #ffe07a, #ffb02e); box-shadow: 0 6px 0 #c47a12, 0 14px 30px -8px rgba(0, 0, 0, .6); transition: transform .1s; }
  .btn-go:active { transform: translateY(4px); box-shadow: 0 2px 0 #c47a12; }
  .btn-alt { border: 1px solid var(--line); border-radius: 18px; padding: 14px 20px; background: rgba(255, 255, 255, .08); backdrop-filter: blur(8px); font-weight: 700; }
  .btn-alt:disabled { opacity: .55; }
  .btn-alt small { display: block; font-weight: 500; opacity: .8; font-size: .8rem; }

  /* HUD */
  #hud { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 12px; right: 12px; z-index: 10; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  .hud-l, .hud-r { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; backdrop-filter: blur(8px); }
  .heart { font-size: 1.4rem; color: #ff4d6d; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .3)); transition: transform .3s, opacity .3s; }
  .heart.lost { opacity: .22; transform: scale(.75); filter: grayscale(1); }
  .coin { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, #ffc940 50%, #d18a0d); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .25); }
  #coins { font-family: var(--display); font-weight: 800; font-size: 1.2rem; min-width: 1.5ch; }
  #item { font-size: 1.4rem; }
  #item.pop { animation: itemPop .8s cubic-bezier(.2, 1.8, .4, 1); }
  @keyframes itemPop { from { transform: scale(3) rotate(-30deg); } }
  #hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%); z-index: 9; background: var(--panel); border: 1px solid var(--line); padding: 10px 18px; border-radius: 999px; font-weight: 600; animation: pulse 1.6s ease-in-out infinite; pointer-events: none; }
  @keyframes pulse { 50% { opacity: .55; } }

  /* Sprecher */
  #talk { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); z-index: 20; display: flex; align-items: flex-end; gap: 8px; max-width: 720px; margin: 0 auto;
    transform: translateY(140%); transition: transform .35s cubic-bezier(.2, 1.3, .4, 1); pointer-events: auto; }
  #talk.show { transform: none; }
  #talk-face { width: 110px; height: 136px; flex: none; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .4)); }
  .talk-bubble { flex: 1; background: #fff; color: #1b1430; border: 4px solid #1b1430; border-radius: 22px; padding: 10px 16px 12px; box-shadow: 0 6px 0 rgba(0, 0, 0, .3); position: relative; margin-bottom: 18px; }
  .talk-bubble::before { content: ''; position: absolute; left: -14px; bottom: 18px; width: 20px; height: 20px; background: #fff; border-left: 4px solid #1b1430; border-bottom: 4px solid #1b1430; transform: rotate(45deg); }
  #talk-name { font-family: var(--display); font-weight: 800; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: #c2185b; }
  #talk[data-who="uhu"] #talk-name { color: #7a4f2a; } #talk[data-who="flitz"] #talk-name { color: #e0459a; } #talk[data-who="kuckuck"] #talk-name { color: #b06a1a; }
  #talk-text { font-size: clamp(1rem, 2.4vw, 1.2rem); font-weight: 700; line-height: 1.3; }
  .npc-face { width: 100%; height: 100%; border-radius: 50%; }
  .npc-face.flitz { background: radial-gradient(circle at 40% 35%, #ffb3d9, #ff5fa8 60%, #b8236b); border: 4px solid #1b1430; height: 100px; margin-top: 30px; }
  .npc-face.kuckuck { background: radial-gradient(circle at 40% 35%, #e6b783, #8d5a2b 70%); border: 4px solid #1b1430; height: 100px; margin-top: 30px; }
  .talking .npc-face { animation: talkBob .3s ease-in-out infinite; }

  /* Rätsel */
  #riddle { position: fixed; inset: 0; z-index: 25; display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top) + 60px) 14px calc(env(safe-area-inset-bottom) + 14px); pointer-events: none; }
  .r-card { pointer-events: auto; width: min(560px, 100%); max-height: 100%; overflow: auto; background: linear-gradient(180deg, #fff9ec, #f3e3c2); color: #2b1b06; border: 5px solid #a8743f; border-radius: 26px;
    padding: 18px 18px 16px; box-shadow: 0 0 0 4px #ffd98a inset, 0 30px 60px -20px rgba(0, 0, 0, .7); transform: translateY(40px) rotateX(25deg) scale(.9); opacity: 0; transition: transform .45s cubic-bezier(.2, 1.4, .4, 1), opacity .3s; position: relative; }
  #riddle.show .r-card { transform: none; opacity: 1; }
  .r-tier { position: absolute; top: -18px; right: 18px; background: #2b1b06; color: var(--gold); border-radius: 14px; padding: 4px 12px; font-family: var(--display); font-size: 1.1rem; text-align: center; line-height: 1; }
  .r-tier small { display: block; font-size: .6rem; color: #fff; font-family: var(--font); }
  .r-q { font-family: var(--display); font-weight: 700; font-size: clamp(1.15rem, 3vw, 1.45rem); line-height: 1.3; padding-right: 54px; }
  .r-q .seq { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; } .r-q .seq span { background: #2b1b06; color: #fff; border-radius: 10px; padding: 6px 10px; }
  .r-svg { display: flex; justify-content: center; margin: 10px 0 0; background: #1b1440; border-radius: 16px; padding: 8px; }
  .r-svg .qsvg { width: min(100%, 260px); height: auto; max-height: 26vh; }
  .r-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .r-opt { display: flex; align-items: center; gap: 10px; text-align: left; min-height: 58px; padding: 10px 12px; border-radius: 16px; border: 3px solid #a8743f; background: #fffdf6; font-weight: 700; font-size: 1.05rem; color: #2b1b06;
    box-shadow: 0 5px 0 #c99a4b; animation: optIn .45s cubic-bezier(.2, 1.6, .4, 1) both; transition: transform .1s, background .2s; }
  .r-opt span { flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: #2b1b06; color: var(--gold); font-family: var(--display); }
  .r-opt:active { transform: translateY(3px); box-shadow: 0 2px 0 #c99a4b; }
  .r-opt.sel { background: #ffe9a8; border-color: #e09a12; animation: selPulse .5s ease-in-out infinite alternate; }
  .r-opt.right { background: #c8f7df; border-color: #1fa86b; box-shadow: 0 5px 0 #1fa86b; animation: rightPop .5s cubic-bezier(.2, 1.8, .4, 1); }
  .r-opt.wrong { background: #ffd2da; border-color: #d62f52; box-shadow: 0 5px 0 #d62f52; animation: shake .4s; }
  .r-opt.gone { opacity: .2; transform: scale(.9) rotate(-3deg); filter: grayscale(1); }
  @keyframes optIn { from { transform: scale(.4); opacity: 0; } }
  @keyframes selPulse { to { transform: scale(1.03); } }
  @keyframes rightPop { 40% { transform: scale(1.12); } }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .r-item { margin-top: 12px; width: 100%; border: 3px dashed #7a4f2a; background: #fff3cf; border-radius: 14px; padding: 10px; font-weight: 800; color: #2b1b06; }
  .r-time { height: 10px; margin-top: 14px; border-radius: 6px; background: rgba(0, 0, 0, .12); overflow: hidden; }
  .r-time i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #2fe39f, #ffc940); transition: width .1s linear; }
  .r-time i.urgent { background: #ff4d6d; animation: pulse .4s infinite; }
  @media (max-width: 420px) { .r-opts { grid-template-columns: 1fr; } }

  .btn-go small { display: block; font: 600 .78rem var(--font); opacity: .75; }
  .in { width: 100%; border-radius: 16px; border: 2px solid var(--line); background: rgba(20, 12, 50, .6); color: #fff; padding: 13px 16px; font: 700 1.05rem var(--font); text-align: center; user-select: text; -webkit-user-select: text; }
  .in:focus { outline: none; border-color: var(--gold); }
  .join-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; }
  .join-row .in { letter-spacing: .2em; text-transform: uppercase; }
  .join-row.focus .btn-alt { border-color: var(--gold); background: rgba(255, 201, 64, .18); }
  /* Lobby */
  #lobby { position: fixed; inset: 0; z-index: 36; display: grid; place-items: center; padding: 16px; background: rgba(15, 8, 40, .55); backdrop-filter: blur(6px); }
  .lb-card { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 28px; padding: 22px; text-align: center; animation: logoIn .6s cubic-bezier(.2, 1.4, .4, 1); display: grid; gap: 12px; }
  .lb-card h2 { font-family: var(--display); margin: 0; } .lb-card p { margin: 0; opacity: .85; }
  .lb-code { font-size: 2.2rem; letter-spacing: .18em; color: var(--gold); }
  .lb-qr { width: 190px; height: 190px; margin: 0 auto; border-radius: 16px; background: #fff; padding: 8px; image-rendering: pixelated; }
  .lb-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; text-align: left; }
  .lb-list li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 14px; background: rgba(255, 255, 255, .07); font-weight: 700; animation: rise .4s both; }
  .lb-dot { width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(255, 255, 255, .2); }
  .lb-wait { font-size: 1.1rem; opacity: .8; } .lb-err { color: #ff9aa9; font-weight: 700; }
  .btn-go:disabled { filter: grayscale(.7); opacity: .6; }
  /* Ticker */
  #ticker { position: fixed; top: calc(env(safe-area-inset-top) + 60px); left: 50%; transform: translateX(-50%); z-index: 22; display: grid; gap: 6px; pointer-events: none; width: min(460px, 92vw); }
  .tk { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-weight: 700; text-align: center; animation: tkIn .4s cubic-bezier(.2, 1.4, .4, 1); transition: opacity .5s, transform .5s; }
  .tk.out { opacity: 0; transform: translateY(-10px); }
  @keyframes tkIn { from { transform: translateY(-20px) scale(.9); opacity: 0; } }
  /* Ende */
  #end { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; padding: 16px; background: rgba(15, 8, 40, .55); backdrop-filter: blur(4px); }
  .end-card { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 28px; padding: 24px; text-align: center; animation: logoIn .7s cubic-bezier(.2, 1.4, .4, 1); }
  .end-card h2 { font-family: var(--display); font-size: 2rem; margin: 0 0 6px; color: var(--gold); }
  .end-stats { display: flex; justify-content: center; gap: 24px; margin: 18px 0 22px; } .end-stats b { display: block; font-family: var(--display); font-size: 1.8rem; } .end-stats small { opacity: .75; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/jsm/" } }</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="loading"><div class="load-box">Die Uhrwerk-Insel wird aufgezogen …<div class="load-track"><div id="load-bar"></div></div></div></div>

<div id="title">
  <h1 class="logo">Die Rätsel&shy;welten</h1>
  <div class="chapter">Kapitel 1 · Die Uhrwerk-Insel</div>
  <div class="menu">
    <input class="in" id="name" maxlength="14" placeholder="Dein Name" autocomplete="off">
    <button class="btn-go" id="btn-solo">Allein spielen <small>gegen Flitz</small></button>
    <button class="btn-alt" id="btn-host">Mehrspieler: Raum erstellen <small>2–6 Geräte, Code oder QR</small></button>
    <div class="join-row" id="join-row"><input class="in" id="code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters"><button class="btn-alt" id="btn-join">Raum beitreten</button></div>
  </div>
</div>

<div id="hud" hidden>
  <div class="hud-l" id="hearts"></div>
  <div class="hud-r"><span id="item" hidden>🔭</span><span class="coin"></span><span id="coins">0</span></div>
</div>
<div id="hint" hidden>Tippe auf den Boden, um loszulaufen</div>

<div id="talk"><div id="talk-face"></div><div class="talk-bubble"><div id="talk-name"></div><div id="talk-text"></div></div></div>
<div id="riddle" hidden></div>
<div id="lobby" hidden></div>
<div id="ticker"></div>
<div id="end" hidden></div>

<script src="../js/calib.js"></script>
<script src="../js/difficulty.js"></script>
<script src="../js/questions.js"></script>
<script src="../js/bank.js"></script>
<script src="../js/host.js"></script>
<script src="../js/casts.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
